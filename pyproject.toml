[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "multigas"
version = "0.1.0"
authors = [
    {name = "Martanto", email = "martanto@live.com"},
]
description = "Python package for multigas sensor"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["multigas", "volcano", "gas", "sensor", "monitoring"]
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[dependency-groups]
dev = [
    "uv-build",
    "ruff",
    "ty",
    "ipykernel",
    "notebook",
    "pytest>=9.0.2",
    "ipywidgets>=8.1.8",
]

[tool.uv]
cache-dir = "./.cache/uv"

[project.urls]
Homepage = "https://github.com/martanto/multigas"
Issues = "https://github.com/martanto/multigas/issues"
