[build-system]
requires = ["uv_build >=0.11.0, <0.12"]
build-backend = "uv_build"

[project]
name = "multigas"
version = "0.1.0"
authors = [
    {name = "Martanto", email = "martanto@live.com"},
]
description = "Python package for multigas sensor"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["multigas", "volcano", "gas", "sensor", "monitoring"]
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.3",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pandas-stubs~=3.0.2",
    "python-dotenv>=1.2.2",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[dependency-groups]
dev = [
    "uv-build",
    "ipykernel",
    "notebook",
    "ipywidgets",
    "pandas-stubs>=3.0.0.260204",
    {include-group = "lint"},
    {include-group = "test"},
]
lint = [
    "ruff",
    "ty",
]
test = [
  "pytest"
]

[tool.uv]
cache-dir = "./.cache/uv"

[project.urls]
Homepage = "https://github.com/martanto/multigas"
Issues = "https://github.com/martanto/multigas/issues"
